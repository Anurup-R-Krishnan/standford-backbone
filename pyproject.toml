[project]
name = "standford-backbone"
version = "2.0.0"
description = "Modernized Stanford Backbone & Internet2 network emulation and ATPG research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dpkt>=1.9.8",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "bandit>=1.8.0",
    "semgrep>=1.100.0",
    "radon>=6.0.0",
    "interrogate>=1.7.0",
    "refurb>=2.0.0",
    "pyupgrade>=3.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "F403", # wildcard imports (used extensively in research modules)
    "F405", # names from wildcard imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    "^\\.venv",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
fail-under = 40
exclude = ["setup.py", "docs", ".venv"]

[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B101"]  # assert usage
